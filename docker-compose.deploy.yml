name: pazario-deploy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pazario}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-pazario_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pazario} -d ${DB_NAME:-pazario_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pazario-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pazario-net

  backend:
    build:
      context: ./pazario-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.deploy.example
      - path: ./.env.deploy
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-pazario}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-pazario_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key
      XML_IMPORT_DIR: /app/imports
    command: sh -c "npx prisma migrate deploy && npx tsx src/index.ts"
    volumes:
      - ./logs:/app/logs
      - ./imports:/app/imports:ro
      - ./public.pem:/run/secrets/jwt_public_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - pazario-net

  admin:
    build:
      context: ./pazario-admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pazario-net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.deploy.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - admin
      - backend
    networks:
      - pazario-net

volumes:
  postgres_data:
  redis_data:

networks:
  pazario-net:
    driver: bridge
