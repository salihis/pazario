# .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pazario
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pazario_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Prisma generate
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://pazario:password@localhost:5432/pazario_db

      - name: Prisma migrate
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://pazario:password@localhost:5432/pazario_db

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://pazario:password@localhost:5432/pazario_db
          REDIS_URL: redis://localhost:6379
          FIELD_ENCRYPTION_KEY: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
          JWT_SECRET: test-secret-key-min-32-characters-long
          NODE_ENV: test

      - name: Build frontend
        run: npm run build
        working-directory: ../pazario-admin
        continue-on-error: true

      - name: Build backend
        run: npm run build

      - name: SonarQube Scan (optional)
        if: always()
        continue-on-error: true
        run: |
          echo "SonarQube scan would run here"
