name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/pazario-backend

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # TEST & LINT STAGE
  # ─────────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pazario
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pazario_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'pazario-backend/package-lock.json'

      - name: Install dependencies (Backend)
        working-directory: ./pazario-backend
        run: npm ci

      - name: Type checking
        working-directory: ./pazario-backend
        run: npm run typecheck

      - name: Lint code
        working-directory: ./pazario-backend
        run: npm run lint || echo "Linting skipped (not critical)"

      - name: Setup database
        working-directory: ./pazario-backend
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'postgresql://pazario:password@localhost:5432/pazario_test' }}
        run: npx prisma migrate deploy --skip-generate

      - name: Run tests
        working-directory: ./pazario-backend
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'postgresql://pazario:password@localhost:5432/pazario_test' }}
          REDIS_URL: ${{ secrets.TEST_REDIS_URL || 'redis://localhost:6379' }}
        run: npm run test

      - name: Generate coverage report
        working-directory: ./pazario-backend
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'postgresql://pazario:password@localhost:5432/pazario_test' }}
          REDIS_URL: ${{ secrets.TEST_REDIS_URL || 'redis://localhost:6379' }}
        run: npm run test:coverage || echo "Coverage report skipped"

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./pazario-backend/coverage/coverage-final.json
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────────────────
  # BUILD STAGE
  # ─────────────────────────────────────────────────────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./pazario-backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # SECURITY SCANNING
  # ─────────────────────────────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'pazario-backend'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check npm vulnerabilities
        working-directory: ./pazario-backend
        run: npm audit --production || echo "Some vulnerabilities found, but continuing..."

  # ─────────────────────────────────────────────────────────────────────────
  # DEPLOYMENT (Only on main branch)
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, build, security]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_PATH && git pull origin main && docker-compose -f docker-compose.prod.yml up --build -d"

      - name: Notify Slack on deploy
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Deployment status: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Pazar.io Deployment* - ${{ job.status }}\n*Branch:* main\n*Commit:* ${{ github.sha }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ─────────────────────────────────────────────────────────────────────────
  # NOTIFICATION
  # ─────────────────────────────────────────────────────────────────────────
  notify:
    if: always()
    needs: [test, build]
    runs-on: ubuntu-latest

    steps:
      - name: Report status to Slack
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "CI Pipeline: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*GitHub Action:* ${{ github.workflow }}\n*Branch:* ${{ github.ref }}\n*Status:* ${{ job.status }}\n*Author:* ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
